name: Release

# One button for a kit release (dec-202, dec-208): validate the skill, tag
# schemabounce--v<version>, publish the GitHub release with the archives hosted
# Code Mode pins, re-pin the Claude and Codex marketplaces in claude-plugins,
# and print the Code Mode pin for the argocd commit a person pushes.
#
# Dispatch only, from main, after a person has merged development into main
# (SchemaBounce CI rule: no tag-push or pull_request triggers). The release
# environment carries the required reviewer.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, matching the manifests (for example 0.5.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kit-release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  TAG: schemabounce--v${{ inputs.version }}

jobs:
  validate:
    name: Validate the skill and the version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases run from main only; this run is on ${GITHUB_REF}." >&2
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Refuse a tag that already exists
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "${TAG} already exists; bump the version in the manifests first." >&2
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the official Agent Skills validator (hash-pinned)
        run: python -m pip install --require-hashes --no-deps -r .github/requirements-release.txt

      - name: Validate against the Agent Skills spec
        run: agentskills validate skills/schemabounce

      - name: Release checks (versions, references, writing rules)
        run: python scripts/check_release.py "${VERSION}"

  release:
    name: Tag and publish the GitHub release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    outputs:
      digest: ${{ steps.archives.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the archives (one top-level directory, as Code Mode expects)
        id: archives
        run: |
          set -euo pipefail
          base="schemabounce-${VERSION}"
          git archive --format=tar.gz --prefix="${base}/" -o "${base}.tar.gz" HEAD
          git archive --format=zip --prefix="${base}/" -o "${base}.zip" HEAD
          sha256sum "${base}.tar.gz" > "${base}.tar.gz.sha256"
          sha256sum "${base}.zip" > "${base}.zip.sha256"
          echo "digest=sha256:$(cut -d' ' -f1 "${base}.tar.gz.sha256")" >> "${GITHUB_OUTPUT}"

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="schemabounce-${VERSION}"
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "SchemaBounce agent kit ${VERSION}" \
            --generate-notes \
            "${base}.tar.gz" "${base}.tar.gz.sha256" "${base}.zip" "${base}.zip.sha256"

  marketplaces:
    name: Re-pin the Claude and Codex marketplaces
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - name: Skip until the release App exists
        id: app
        env:
          APP_ID: ${{ secrets.KIT_RELEASE_APP_ID }}
        run: |
          if [ -z "${APP_ID}" ]; then
            echo "KIT_RELEASE_APP_ID is not set: re-pin claude-plugins by hand to ${TAG}." >> "${GITHUB_STEP_SUMMARY}"
            echo "ready=false" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          fi

      # A GitHub App installed only on SchemaBounce/claude-plugins with
      # contents:write: a short-lived token that can touch nothing else.
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        if: steps.app.outputs.ready == 'true'
        id: token
        with:
          app-id: ${{ secrets.KIT_RELEASE_APP_ID }}
          private-key: ${{ secrets.KIT_RELEASE_APP_PRIVATE_KEY }}
          owner: SchemaBounce
          repositories: claude-plugins

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.app.outputs.ready == 'true'
        with:
          repository: SchemaBounce/claude-plugins
          ref: development
          token: ${{ steps.token.outputs.token }}

      - name: Point both marketplaces at the new tag
        if: steps.app.outputs.ready == 'true'
        run: |
          set -euo pipefail
          for f in .claude-plugin/marketplace.json .agents/plugins/marketplace.json; do
            jq --arg tag "${TAG}" \
              '(.plugins[] | select(.name == "schemabounce") | .source.ref) = $tag' \
              "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done
          git diff --stat
          git config user.name "schemabounce-kit-release[bot]"
          git config user.email "support@schemabounce.com"
          git add .claude-plugin/marketplace.json .agents/plugins/marketplace.json
          git commit -m "schemabounce: pin the agent kit ${VERSION} release" \
                     -m "Released by the agent kit Release workflow, run ${GITHUB_RUN_ID}."
          git push origin HEAD:development

  code-mode-pin:
    name: Print the Code Mode pin
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write the argocd values to the summary
        env:
          DIGEST: ${{ needs.release.outputs.digest }}
        run: |
          {
            echo "### Hosted Code Mode pin (argocd environments/prod/core-api.yaml)"
            echo
            echo "A person commits and pushes these on argocd main:"
            echo
            echo '```yaml'
            echo "- name: coreApi.codeSandbox.agentKit.version"
            echo "  value: \"${VERSION}\""
            echo "- name: coreApi.codeSandbox.agentKit.digest"
            echo "  value: \"${DIGEST}\""
            echo "- name: coreApi.codeSandbox.agentKit.url"
            echo "  value: \"https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/schemabounce-${VERSION}.tar.gz\""
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
